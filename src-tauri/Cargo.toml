[package]
name = "aula-studio"
version = "0.3.0"
description = "AULA F75 Max wireless lighting and battery"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
