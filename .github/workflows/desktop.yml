name: Desktop builds
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            libfuse2 libssl-dev libudev-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev wget
      - run: npm ci
      - run: npm run test:ui
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      # test:ui already builds and checks web-dist; don't compile it twice.
      - run: npm run tauri -- build --config scripts/tauri-ci.json --bundles ${{ matrix.bundles }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item src-tauri/target/release/aula-studio.exe src-tauri/target/release/AULA-Studio-Windows-x64.exe
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/source-archive.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: aula-studio-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/AULA-Studio-Windows-x64.exe
            dist/AULA-Studio-source.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
            if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
              gh release create "$RELEASE_TAG" "${flags[@]}" --title "AULA Studio $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
            else
              gh release create "$RELEASE_TAG" "${flags[@]}" --title "AULA Studio $RELEASE_TAG" --notes "Includes 2.4 GHz RGB effects, per-key colors, battery status, scalable pastel light/dark UI, editable color presets, and wired USB PNG/JPEG/GIF display uploads with clock sync. Lighting and display playback are confirmed on Windows. macOS Apple Silicon builds are provided but require hardware testing. Linux x64 AppImage is built on Ubuntu 22.04; Linux hardware behavior requires testing. GIF uploads require wired USB. Includes portable source. Unofficial community software; binaries are unsigned."
            fi
          fi
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' \) -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
